blueprint:
  name: Uitkijk – wie is dit?
  description: >-
    camera-service ziet een onbekend gezicht (de eerste keer, en nog eens als iemand vaker komt).
    De melding heeft knoppen met bekende namen, "Nieuwe persoon…" (naam typen) en "Negeren".
    Het antwoord gaat via MQTT terug; camera-service leert dan alle foto's van die persoon.
    Werkt met de iOS- en Android-app van Home Assistant (houd de melding ingedrukt).
  domain: automation
  author: Uitkijk
  source_url: https://github.com/lexi1986/uitkijk/blob/main/homeassistant/blueprints/automation/camera_service/wie_is_dit.yaml
  homeassistant:
    min_version: "2024.10.0"
  input:
    event_entities:
      name: Event-entiteiten van de camera's met gezichtsherkenning
      selector:
        entity:
          domain: event
          integration: mqtt
          multiple: true
    notify_targets:
      name: Meldingsdiensten
      selector:
        text:
          multiple: true
    topic_prefix:
      name: MQTT-prefix van camera-service
      default: camsvc
      selector:
        text: {}

mode: queued
max: 10

variables:
  targets: !input notify_targets
  prefix: !input topic_prefix

triggers:
  - trigger: state
    entity_id: !input event_entities
    not_to: ["unavailable", "unknown"]
    id: vraag
  - trigger: event
    event_type: mobile_app_notification_action
    id: antwoord

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: vraag
          - "{{ trigger.to_state.attributes.event_type == 'onbekend_gezicht' }}"
        sequence:
          - variables:
              a: "{{ trigger.to_state.attributes }}"
              cam: "{{ trigger.entity_id | replace('event.cam_', '') | replace('_event', '') }}"
              naam_cam: "{{ state_attr(trigger.entity_id, 'friendly_name') | replace(' Event', '') }}"
              knoppen: >-
                {% set ns = namespace(k=[]) %}{% for n in (a.namen or []) %}{% set ns.k = ns.k + [{'action': 'CAMSVC_FACE|' ~ a.sample ~ '|' ~ n, 'title': n}] %}{% endfor %}
                {{ ns.k + [{'action': 'CAMSVC_FACE_NEW|' ~ a.sample, 'title': 'Nieuwe persoon…', 'behavior': 'textInput', 'textInputButtonTitle': 'Opslaan', 'textInputPlaceholder': 'Naam'},
                           {'action': 'CAMSVC_FACE_IGNORE|' ~ a.sample, 'title': 'Negeren', 'destructive': true}] }}
          - repeat:
              for_each: "{{ targets }}"
              sequence:
                - action: "{{ repeat.item }}"
                  data:
                    title: "🙂 Wie is dit bij {{ naam_cam }}?"
                    message: >-
                      {{ 'Al ' ~ a.aantal ~ '× gezien' if (a.aantal | int(1)) > 1 else 'Voor het eerst gezien' }}{{ ', lijkt op ' ~ a.suggestie if a.suggestie else '' }}. Houd ingedrukt om een naam te kiezen.
                    data:
                      image: "/api/camera_proxy/camera.cam_{{ cam }}_snapshot"
                      tag: "camsvc-gezicht-{{ a.sample }}"
                      group: camera-gezichten
                      actions: "{{ knoppen }}"
      - conditions:
          - condition: trigger
            id: antwoord
          - "{{ trigger.event.data.action is string and trigger.event.data.action.startswith('CAMSVC_FACE') }}"
        sequence:
          - variables:
              delen: "{{ trigger.event.data.action.split('|') }}"
              soort: "{{ delen[0] }}"
              sample: "{{ delen[1] }}"
              naam: "{{ delen[2] if soort == 'CAMSVC_FACE' else (trigger.event.data.reply_text | default('') | trim) }}"
          - action: mqtt.publish
            data:
              topic: "{{ prefix }}/server/gezicht"
              payload: "{{ {'sample': sample, 'name': naam, 'negeren': soort == 'CAMSVC_FACE_IGNORE'} | to_json }}"
          - repeat:
              for_each: "{{ targets }}"
              sequence:
                - action: "{{ repeat.item }}"
                  data:
                    message: clear_notification
                    data:
                      tag: "camsvc-gezicht-{{ sample }}"
