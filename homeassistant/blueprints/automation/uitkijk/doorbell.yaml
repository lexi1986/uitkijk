blueprint:
  name: Uitkijk – doorbell
  description: >-
    When someone rings the doorbell, Uitkijk starts a recording right away (with the seconds before)
    and looks for a face. You get a notification immediately; when the person is recognised within a
    few seconds, it is replaced by one with the name.
  domain: automation
  author: Uitkijk
  source_url: https://github.com/lexi1986/uitkijk/blob/main/homeassistant/blueprints/automation/uitkijk/doorbell.yaml
  homeassistant:
    min_version: "2024.10.0"
  input:
    button:
      name: Doorbell button
      description: The entity that changes when the doorbell rings (binary_sensor, event or button of your doorbell).
      selector:
        entity:
          domain: [binary_sensor, event, input_button, button]
    camera_name:
      name: Name of the doorbell camera in Uitkijk
      description: As in the config, e.g. front_door (no spaces).
      default: doorbell
      selector:
        text: {}
    notify_targets:
      name: Notification services
      selector:
        text:
          multiple: true
    app_url:
      name: Address of the Uitkijk web page
      selector:
        text:
          type: url
    topic_prefix:
      name: MQTT prefix of Uitkijk
      default: camsvc
      selector:
        text: {}

mode: restart

variables:
  targets: !input notify_targets
  app: !input app_url
  cam: !input camera_name
  prefix: !input topic_prefix
  face: "sensor.cam_{{ cam }}_face"

triggers:
  - trigger: state
    entity_id: !input button
    not_from: ["unavailable", "unknown"]
    not_to: ["unavailable", "unknown", "off"]

actions:
  - action: mqtt.publish
    data:
      topic: "{{ prefix }}/{{ cam }}/trigger"
      payload: doorbell
  - repeat:
      for_each: "{{ targets }}"
      sequence:
        - action: "{{ repeat.item }}"
          data:
            title: "🔔 Someone is at the door"
            message: "The doorbell rang"
            data:
              image: "/api/camera_proxy/camera.cam_{{ cam }}_snapshot"
              url: "{{ app }}/?live={{ cam }}"
              tag: uitkijk-doorbell
              push:
                interruption-level: time-sensitive
              actions:
                - action: URI
                  title: Watch live
                  uri: "{{ app }}/?live={{ cam }}"
  - wait_template: "{{ states(face) not in ['none', 'unknown', 'unavailable'] }}"
    timeout: { seconds: 6 }
    continue_on_timeout: false
  - repeat:
      for_each: "{{ targets }}"
      sequence:
        - action: "{{ repeat.item }}"
          data:
            title: "🔔 {{ states(face) }} is at the door"
            message: Recognised by the doorbell camera
            data:
              image: "/api/camera_proxy/camera.cam_{{ cam }}_snapshot"
              url: "{{ app }}/?live={{ cam }}"
              tag: uitkijk-doorbell
              push:
                interruption-level: time-sensitive
              actions:
                - action: URI
                  title: Watch live
                  uri: "{{ app }}/?live={{ cam }}"
