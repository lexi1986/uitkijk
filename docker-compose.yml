# Start:  docker compose up -d   and then open http://<ip-of-this-computer>:8080
# The setup code for the first time is in:  docker compose logs camsvc | grep "setup code"
services:
  camsvc:
    build: .
    image: uitkijk:latest
    container_name: uitkijk
    restart: unless-stopped
    # host network: cameras (RTSP), Home Assistant (MQTT) and go2rtc without port juggling
    network_mode: host
    volumes:
      - ./data:/data          # config, faces, plates, models
      - ./clips:/clips        # recordings (can grow large: point this to another disk if needed)
    environment:
      - TZ=Europe/Amsterdam   # your time zone
    # Intel iGPU for hardware decoding (optional; remove if you do not have one)
    # devices:
    #   - /dev/dri:/dev/dri

  go2rtc:
    image: alexxit/go2rtc:1.9.9
    container_name: go2rtc
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./data/go2rtc:/config      # the setup wizard writes go2rtc.yaml here
    environment:
      - TZ=Europe/Amsterdam
