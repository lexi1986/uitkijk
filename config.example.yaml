# Uitkijk configuration
# With Docker the setup wizard creates data/config.yaml for you; this file lists all options.
# Without Docker: copy to /etc/camera-service/config.yaml and adjust.
# After changing: restart the service (docker compose restart camsvc / systemctl restart camera-service)

log_level: INFO

storage:
  clips_dir: /clips                 # separate disk or mount point recommended
  state_dir: /var/lib/camera-service
  retention_days: 7                 # clips older than this are removed
  retention_days_by_label:          # keep some labels longer or shorter
    person: 30
    doorbell: 30
  max_gb: 25                        # above this the oldest clips go first

api:
  host: 0.0.0.0                     # behind a reverse proxy (HTTPS, passkeys): 127.0.0.1
  port: 8080
  # Address at which Home Assistant and your phone reach the service.
  # Used in the clip and snapshot links sent to Home Assistant.
  public_url: http://192.168.1.20:8080

mqtt:
  host: 192.168.1.5                 # Home Assistant with the Mosquitto app; empty = no MQTT
  port: 1883
  username: uitkijk
  password: CHANGE_ME
  topic_prefix: camsvc
  discovery_prefix: homeassistant

model:
  path: /opt/camera-service/models/yolo11n.onnx   # see deploy/export-model.sh (Docker: /data/models/yolo11n.onnx)
  # Google Coral (USB): used when the Coral works, otherwise `path` on the CPU.
  # install.sh sets this line itself once the Coral model exists.
  # coral_path: /opt/camera-service/models/yolo11n_edgetpu.tflite
  device: AUTO                      # only for OpenVINO (.xml): AUTO = iGPU, otherwise CPU
  input_size: 320

# Live view on the web page via go2rtc (included in the Docker setup). Per camera the stream name in
# go2rtc is the camera name by default; otherwise `live: <name>` on the camera.
# live:
#   go2rtc_url: http://localhost:1984

# Descriptions of snapshots by a local vision model (Ollama), only through an SSH tunnel on
# loopback (see the guide, "AI descriptions"). Off unless enabled here.
# ai:
#   enabled: true
#   base_url: http://127.0.0.1:11435     # the tunnel; other addresses are refused
#   model: qwen3-vl:4b-instruct
#   labels: [person, vehicle, doorbell]
#   camera_interval: 30                  # at most one description per camera per 30 s
#   global_per_minute: 6

# Defaults for all cameras; can be overridden per camera.
defaults:
  pre_seconds: 10                   # pre-buffer (starts at a keyframe, so 10-12 s)
  post_seconds: 30                  # keep recording after the last detection
  max_clip_seconds: 300
  record_audio: true
  hwaccel: auto                     # auto / vaapi / qsv / none (see the guide)
  motion:
    fps: 5                          # frames per second that are looked at
    width: 320                      # downscaled for motion detection
    threshold: 25                   # pixel difference that counts as motion (0-255)
    min_area: 0.004                 # share of the frame that has to move (0.4%)
    cooldown_seconds: 5
  objects:
    enabled: true
    max_fps: auto                   # model runs per second; auto = 5 with a Coral, otherwise 2
    always: false                   # with a Coral: also look for people without motion
    min_score: 0.55
    min_hits: 2                     # seen this often within the window = confirmed
    hit_window_seconds: 3
    labels:
      person: true
      vehicle: true
      animal: false

# Names: only a-z, 0-9 and _. They show up in Home Assistant (binary_sensor.cam_<name>_person).
# Change the names, IP addresses and logins.
cameras:
  # --- Foscam video doorbell -----------------------------------------------------------
  # Foscam RTSP is on port 88 (sometimes 554): videoMain = high quality, videoSub = low.
  # Test in VLC first: Media → Open Network Stream → the URL below.
  # The doorbell's G.711 audio is converted to AAC in the clips automatically.
  - name: front_door
    friendly_name: Front door
    main_url: rtsp://user:password@192.168.1.31:88/videoMain
    sub_url: rtsp://user:password@192.168.1.31:88/videoSub
    # H.264 Baseline (Foscam) does not play on iPhone via MSE: try WebRTC first.
    live_mode: webrtc,mse
    # Face recognition: teach people via the web page (see the guide).
    faces:
      enabled: true
    # With a Coral: someone standing still at the door keeps being seen.
    objects:
      always: true
    # Or via ONVIF (Foscam usually uses port 888):
    # onvif: {host: 192.168.1.31, port: 888, username: user, password: password}
    mask:
      # - [[0, 0], [100, 0], [100, 15], [0, 15]]     # top strip (e.g. the street)

  # --- Reolink 1 ------------------------------------------------------------------------
  # Reolink: h264Preview_01_main / h264Preview_01_sub (or Preview_01_main/_sub).
  - name: driveway
    friendly_name: Driveway
    main_url: rtsp://user:password@192.168.1.32:554/h264Preview_01_main
    sub_url: rtsp://user:password@192.168.1.32:554/h264Preview_01_sub
    # onvif: {host: 192.168.1.32, port: 8000, username: user, password: password}
    mask:

  # --- Reolink 2 ------------------------------------------------------------------------
  - name: garden
    friendly_name: Garden
    main_url: rtsp://user:password@192.168.1.33:554/h264Preview_01_main
    sub_url: rtsp://user:password@192.168.1.33:554/h264Preview_01_sub
    mask:
    # Per camera you can override anything from `defaults`, e.g. also animals in the garden:
    objects:
      labels:
        animal: true

# Optional: log in with passkeys (requires HTTPS with a domain name, e.g. a reverse proxy in front)
# auth:
#   enabled: true
#   rp_id: camera.example.com
#   origin: https://camera.example.com
#   session_days: 90

# Daily summary to Home Assistant (empty = off)
# summary_time: "22:00"
